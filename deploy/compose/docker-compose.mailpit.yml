# docker-compose.mailpit.yml — a LOCAL test mailbox for the minutes lane.
#
# Mailpit accepts every message on SMTP :1025 and shows it in a web UI on :8025, so the whole
# post_meeting flow (process → email_minutes → email_attendees) can be witnessed on a laptop
# without a real mail account. Pair it with these .env values:
#
#   VEXA_MAIL_ADDR=minutes@local.test
#   VEXA_MAIL_SMTP_HOST=mailpit
#   VEXA_MAIL_SMTP_PORT=1025
#   VEXA_MAILPIT_URL=http://mailpit:8025
#
# Bring the stack up with both files:
#   docker compose -p vexa-v012 -f docker-compose.yml -f docker-compose.mailpit.yml up -d
#
# Never use this in a real deployment: Mailpit delivers nothing anywhere.
services:
  mailpit:
    image: axllent/mailpit:v1.30
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-18025}:8025"
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [vexa]
    restart: unless-stopped
